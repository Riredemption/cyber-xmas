<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#050103">
  <title>Dear Yue &amp; Lin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&display=swap');

    body {
      margin: 0;
      background-color: #050103;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    canvas {
      touch-action: none;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #FFF;
      border-bottom-color: #FFC94A;
      border-radius: 50%;
      display: inline-block;
      animation: rotation 1s linear infinite;
    }

    @keyframes rotation {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.12?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.96.1?external=react,react-dom,three,@react-three/fiber",
    "@react-three/postprocessing": "https://esm.sh/@react-three/postprocessing@2.16.0?external=react,three,@react-three/fiber,postprocessing",
    "postprocessing": "https://esm.sh/postprocessing@6.34.1?external=three",
    "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision@0.10.9"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useMemo, useCallback, Suspense } from 'react';
    import ReactDOM from 'react-dom/client';
    import * as THREE from 'three';
    import { Canvas, useFrame } from '@react-three/fiber';
    import { PerspectiveCamera, OrbitControls, Sparkles, Html, useProgress, Environment } from '@react-three/drei';
    import { EffectComposer, Bloom, Vignette } from '@react-three/postprocessing';
    import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

    // --- CONFIGURATION ---
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // [CRITICAL CHECK] Detect if running via "file://" protocol (Double click) or "http://" (Server)
    // Browsers BLOCK loading local files via JS when using file:// protocol.
    const isFileProtocol = window.location.protocol === 'file:';

    const resolvePath = (path) => {
      try {
        if (!path || /^(http|https|blob|data|file):/.test(path)) return path;
        const base = document.baseURI || window.location.href;
        if (!base || base.startsWith('about:') || base.startsWith('data:')) return null;
        return new URL(path, base).href;
      } catch (e) { return null; }
    };

    // [SMART ASSET STRATEGY]
    // 1. ONLINE_PATHS: Guaranteed to work anywhere (but needs internet).
    const ONLINE_PATHS = {
      MUSIC: "https://files.freemusicarchive.org/storage-freemusicarchive-org/music/no_curator/Kevin_MacLeod/Jazz_Sampler/Kevin_MacLeod_-_Jingle_Bells.mp3",
      WASM: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm",
      MODEL: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      HDR: "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_09_1k.hdr"
    };

    // 2. LOCAL_PATHS: Fast, offline, but requires a Local Server (e.g. VS Code Live Server).
    const LOCAL_PATHS = {
      MUSIC: resolvePath('./assets/music.mp3'),
      HDR: resolvePath('./assets/environment.hdr'),
      WASM: resolvePath('./assets/wasm'),
      MODEL: resolvePath('./assets/hand_landmarker.task')
    };

    // Automatically switch based on environment
    const PATHS = isFileProtocol ? ONLINE_PATHS : LOCAL_PATHS;

    // [GESTURE] Candidate sources for the hand-tracking model.
    // Local first (offline, fast), CDN as fallback so it works out of the box.
    const GESTURE_CANDIDATES = isFileProtocol
      ? [{ wasm: ONLINE_PATHS.WASM, model: ONLINE_PATHS.MODEL }]
      : [
        { wasm: LOCAL_PATHS.WASM, model: LOCAL_PATHS.MODEL },
        { wasm: ONLINE_PATHS.WASM, model: ONLINE_PATHS.MODEL }
      ];

    const COUNTS = isMobile ? { leaves: 800, deco: 100, ribbon: 200, snow: 100 } : { leaves: 2200, deco: 350, ribbon: 800, snow: 600 };
    const TREE_CONFIG = { height: 18, baseRadius: 7, spiralLoops: 4 };
    const COLORS = { bg: '#040806', leafPink1: '#B9FFCB', leafPink2: '#2FD469', decoWhite: '#FFF6DC', decoPurple: '#FFC94A', ribbon: '#FFD76A' };
    const AppState = { TREE: 'TREE', EXPLODE: 'EXPLODE' };

    // --- MATH HELPERS ---
    const getTreePosition = (ratio, angleOffset = 0) => {
      const y = (ratio * TREE_CONFIG.height) - (TREE_CONFIG.height / 2);
      const r = (1 - ratio) * TREE_CONFIG.baseRadius;
      const theta = Math.random() * Math.PI * 2 + angleOffset;
      const rr = Math.sqrt(Math.random()) * r;
      return [rr * Math.cos(theta), y, rr * Math.sin(theta)];
    };
    const getRibbonPosition = (i) => {
      const ratio = i / COUNTS.ribbon;
      const y = (ratio * TREE_CONFIG.height) - (TREE_CONFIG.height / 2);
      const r = ((1 - ratio) * TREE_CONFIG.baseRadius) + 0.5;
      const theta = ratio * Math.PI * 2 * TREE_CONFIG.spiralLoops;
      return [r * Math.cos(theta), y, r * Math.sin(theta)];
    };
    const getExplodePosition = () => {
      const r = 10 + Math.random() * 15;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      return [r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi)];
    };

    // --- GESTURE RECOGNITION ---
    const HAND_CONNECTIONS = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
    const GESTURE = { NONE: 'NONE', OPEN_PALM: 'OPEN_PALM', FIST: 'FIST', PINCH: 'PINCH' };
    const GESTURE_LABEL = {
      OPEN_PALM: 'OPEN PALM', FIST: 'FIST', PINCH: 'PINCH', NONE: 'NO HAND'
    };

    const vDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

    /**
     * Classify a 21-point hand landmark array into a gesture.
     * Returns { type, x, pinchAmt } where x is the mirrored horizontal
     * position of the palm in [-1, 1] (right = positive).
     */
    const classifyGesture = (lm) => {
      const wrist = lm[0];
      const scale = Math.max(1e-6, vDist(wrist, lm[9])); // wrist -> middle MCP

      const fingerIds = { index: [8, 6], middle: [12, 10], ring: [16, 14], pinky: [20, 18] };
      let extendedCount = 0;
      const extended = {};
      for (const key in fingerIds) {
        const [tipIdx, pipIdx] = fingerIds[key];
        extended[key] = vDist(lm[tipIdx], wrist) > vDist(lm[pipIdx], wrist) * 1.08;
        if (extended[key]) extendedCount++;
      }

      const pinchDist = vDist(lm[4], lm[8]) / scale;

      // Order matters: an open palm often tucks the thumb near the index finger,
      // which would otherwise look like a pinch. All four fingers extended wins.
      let type = GESTURE.NONE;
      if (extendedCount === 4) type = GESTURE.OPEN_PALM;
      else if (extendedCount === 0) type = GESTURE.FIST;
      else if (pinchDist < 0.62 && (extended.middle || extended.ring || extended.pinky)) type = GESTURE.PINCH;

      // Mirror horizontally so moving the hand right spins the tree right.
      const x = THREE.MathUtils.clamp(((1 - lm[9].x) - 0.5) * 2, -1, 1);
      return { type, x, pinchAmt: THREE.MathUtils.clamp(1 - pinchDist / 0.9, 0, 1) };
    };

    /** Load the hand landmarker, preferring local assets and falling back to the CDN. */
    const loadHandLandmarker = async () => {
      let lastError = null;
      for (const candidate of GESTURE_CANDIDATES) {
        if (!candidate.wasm || !candidate.model) continue;
        try {
          const fileset = await FilesetResolver.forVisionTasks(candidate.wasm);
          const options = {
            baseOptions: { modelAssetPath: candidate.model, delegate: 'GPU' },
            runningMode: 'VIDEO',
            numHands: 1
          };
          try {
            return await HandLandmarker.createFromOptions(fileset, options);
          } catch (gpuError) {
            options.baseOptions.delegate = 'CPU';
            return await HandLandmarker.createFromOptions(fileset, options);
          }
        } catch (e) {
          lastError = e;
        }
      }
      throw lastError || new Error('Unable to load hand landmarker');
    };

    // --- COMPONENTS ---
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      render() {
        if (this.state.hasError) return (
          <div className="flex flex-col items-center justify-center h-screen bg-black text-amber-400 p-8 text-center">
            <h2 className="text-xl font-bold mb-4">CRASHED</h2><p className="text-white text-xs opacity-70 mb-4">{this.state.error?.message}</p><button onClick={() => window.location.reload()} className="mt-6 px-6 py-2 border border-pink-500 rounded-full text-white">RELOAD</button>
          </div>
        );
        return this.props.children;
      }
    }

    const SafeLoader = () => {
      const { progress } = useProgress();
      const [show, setShow] = useState(true);
      useEffect(() => { const t = setTimeout(() => setShow(false), 8000); return () => clearTimeout(t); }, []);
      if (!show && progress === 0) return null;
      return (
        <Html center>
          <div className="flex flex-col items-center justify-center p-6 bg-black/90 rounded-2xl backdrop-blur-xl border border-amber-400/30">
            <span className="loader mb-4"></span>
            <div className="text-amber-300 font-bold tracking-widest text-sm text-center">LOADING ASSETS... {Math.round(progress)}%</div>
          </div>
        </Html>
      );
    };

    const Snow = () => {
      const mesh = useRef(null), dummy = useMemo(() => new THREE.Object3D(), []);
      const particles = useMemo(() => Array.from({ length: COUNTS.snow }, () => ({
        x: (Math.random() - 0.5) * 70, y: Math.random() * 50 - 10, z: (Math.random() - 0.5) * 70, speed: 0.05 + Math.random() * 0.1, wobble: Math.random() * Math.PI * 2
      })), []);
      useFrame((state) => {
        if (!mesh.current) return;
        const t = state.clock.getElapsedTime();
        particles.forEach((p, i) => {
          p.y -= p.speed;
          if (p.y < -15) { p.y = 35; p.x = (Math.random() - 0.5) * 70; p.z = (Math.random() - 0.5) * 70; }
          dummy.position.set(p.x + Math.sin(t + p.wobble) * 0.5, p.y, p.z);
          dummy.scale.setScalar(0.05 + Math.random() * 0.05);
          dummy.updateMatrix();
          mesh.current.setMatrixAt(i, dummy.matrix);
        });
        mesh.current.instanceMatrix.needsUpdate = true;
      });
      return <instancedMesh ref={mesh} args={[undefined, undefined, COUNTS.snow]}><octahedronGeometry args={[1, 0]} /><meshBasicMaterial color={[1.5, 1.5, 1.5]} transparent opacity={0.8} toneMapped={false} /></instancedMesh>;
    };

    const BreathingLights = () => {
      const spot = useRef(null), point = useRef(null);
      useFrame(({ clock }) => {
        const t = clock.getElapsedTime();
        if (spot.current) spot.current.intensity = (2 + Math.sin(t * 2)) * 2;
        if (point.current) point.current.intensity = 2 + Math.sin(t * 2);
      });
      return (
        <>
          {/* Soft Ambient to complement HDR */}
          <ambientLight intensity={0.2} color="#16301F" />
          <spotLight ref={spot} position={[0, 15, -10]} angle={0.6} penumbra={1} intensity={5} color="#37E07A" distance={60} decay={1} />
          <pointLight ref={point} position={[5, 2, 5]} intensity={3} color="#FFD24A" distance={40} decay={1} />
        </>
      );
    };

    const Star = ({ appState }) => {
      const mesh = useRef(null), mat = useRef(null);
      const geo = useMemo(() => {
        const s = new THREE.Shape();
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? 0.8 : 0.4, a = i * Math.PI / 5;
          i === 0 ? s.moveTo(Math.cos(a) * r, Math.sin(a) * r) : s.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        s.closePath();
        return new THREE.ExtrudeGeometry(s, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.1, bevelSize: 0.1, bevelSegments: 1 });
      }, []);
      useFrame((state) => {
        if (!mesh.current) return;
        const t = state.clock.getElapsedTime();
        mesh.current.rotation.y = t * 0.5;
        mesh.current.scale.lerp(new THREE.Vector3(appState === 'TREE' ? 1.5 : 0.01, appState === 'TREE' ? 1.5 : 0.01, appState === 'TREE' ? 1.5 : 0.01), 0.1);
        if (mat.current) mat.current.emissiveIntensity = 2 + Math.sin(t * 3) * 1.5;
      });
      return (
        <group position={[0, 9.5, 0]}>
          <mesh ref={mesh} geometry={geo}><meshStandardMaterial ref={mat} color="#FFFFE0" emissive="#FFD700" emissiveIntensity={3} roughness={0.1} metalness={1.0} /></mesh>
          <Sparkles count={20} scale={3} speed={0.4} color="#FFFF00" />
          <pointLight distance={15} intensity={5} color="#FFD700" />
        </group>
      );
    };

    const ChristmasTree = ({ appState, gestureRef }) => {
      const leafRef = useRef(null), decoRef = useRef(null), ribRef = useRef(null);
      const dummy = useMemo(() => new THREE.Object3D(), []);
      const rotRef = useRef(0);
      const spinRef = useRef(0);
      const particles = useMemo(() => {
        const p = [];
        for (let i = 0; i < COUNTS.leaves; i++) p.push({ t: 'L', tree: getTreePosition(Math.random()), exp: getExplodePosition(), rot: [Math.random(), Math.random(), Math.random()], c: Math.random() > 0.5 ? COLORS.leafPink1 : COLORS.leafPink2 });
        for (let i = 0; i < COUNTS.deco; i++) p.push({ t: 'D', tree: getTreePosition(Math.random()), exp: getExplodePosition(), rot: [Math.random(), Math.random(), Math.random()], c: Math.random() > 0.6 ? COLORS.decoWhite : COLORS.decoPurple });
        for (let i = 0; i < COUNTS.ribbon; i++) p.push({ t: 'R', tree: getRibbonPosition(i), exp: getExplodePosition(), rot: [1, 1, 1], c: COLORS.ribbon });
        return p;
      }, []);

      useEffect(() => {
        if (!leafRef.current) return;
        let li = 0, di = 0, ri = 0;
        particles.forEach(p => {
          const c = new THREE.Color(p.c);
          if (p.t === 'L') leafRef.current.setColorAt(li++, c);
          else if (p.t === 'D') decoRef.current.setColorAt(di++, c);
          else ribRef.current.setColorAt(ri++, c);
        });
        leafRef.current.instanceColor.needsUpdate = true;
        decoRef.current.instanceColor.needsUpdate = true;
        ribRef.current.instanceColor.needsUpdate = true;
      }, []);

      const prog = useRef(1);
      useFrame((state, delta) => {
        prog.current = THREE.MathUtils.damp(prog.current, appState === AppState.TREE ? 1 : 0, 2.5, delta);
        const t = prog.current, et = state.clock.getElapsedTime();
        // [GESTURE] Hand X position drives the spin; the tree keeps a gentle idle drift.
        const g = gestureRef.current;
        const targetSpin = g.active ? g.x * 2.4 : 0;
        spinRef.current = THREE.MathUtils.damp(spinRef.current, targetSpin, 4, delta);
        rotRef.current += delta * (0.1 + spinRef.current);
        const rot = rotRef.current;
        let li = 0, di = 0, ri = 0;
        particles.forEach(p => {
          dummy.position.set(
            THREE.MathUtils.lerp(p.exp[0], p.tree[0], t),
            THREE.MathUtils.lerp(p.exp[1], p.tree[1], t),
            THREE.MathUtils.lerp(p.exp[2], p.tree[2], t)
          );
          const s = THREE.MathUtils.lerp(0.01, p.t === 'R' ? 0.08 : (p.t === 'D' ? 0.15 : 0.12), t) * (appState === AppState.TREE ? (1 + Math.sin(et * 2) * 0.1) : 1);
          dummy.scale.setScalar(s);
          dummy.rotation.set(et * p.rot[0], et * p.rot[1], et * p.rot[2]);
          dummy.updateMatrix();
          if (p.t === 'L') leafRef.current.setMatrixAt(li++, dummy.matrix);
          else if (p.t === 'D') decoRef.current.setMatrixAt(di++, dummy.matrix);
          else ribRef.current.setMatrixAt(ri++, dummy.matrix);
        });
        leafRef.current.instanceMatrix.needsUpdate = true;
        decoRef.current.instanceMatrix.needsUpdate = true;
        ribRef.current.instanceMatrix.needsUpdate = true;
        leafRef.current.rotation.y = decoRef.current.rotation.y = ribRef.current.rotation.y = rot;
      });

      // [RESTORED] High metalness for reflections, now that we have HDR
      return (
        <group>
          <instancedMesh ref={leafRef} args={[undefined, undefined, COUNTS.leaves]}><octahedronGeometry args={[1, 0]} /><meshStandardMaterial metalness={0.7} roughness={0.2} /></instancedMesh>
          <instancedMesh ref={decoRef} args={[undefined, undefined, COUNTS.deco]}><icosahedronGeometry args={[1, 0]} /><meshPhysicalMaterial metalness={0.9} roughness={0.1} envMapIntensity={2} clearcoat={1} /></instancedMesh>
          <instancedMesh ref={ribRef} args={[undefined, undefined, COUNTS.ribbon]}><tetrahedronGeometry args={[1, 0]} /><meshBasicMaterial toneMapped={false} /></instancedMesh>
        </group>
      );
    };

    const getCamZ = () => Math.max(28, 8.6 / (Math.tan(THREE.MathUtils.degToRad(22.5)) * (window.innerWidth / Math.max(1, window.innerHeight))));

    // [GESTURE] Applies pinch-driven zoom to the tree without re-rendering React.
    const GestureZoom = ({ gestureRef, children }) => {
      const ref = useRef(null);
      useFrame((state, delta) => {
        if (!ref.current) return;
        const g = gestureRef.current;
        const target = g.active ? 1 + g.pinchAmt * 0.45 : 1;
        const s = THREE.MathUtils.damp(ref.current.scale.x, target, 5, delta);
        ref.current.scale.setScalar(s);
      });
      return <group ref={ref}>{children}</group>;
    };

    const Scene = ({ appState, gestureRef }) => {
      return (
      <>
        <OrbitControls enablePan={false} minDistance={10} maxDistance={60} autoRotate={false} target={[0, 0, 0]} />

        <BreathingLights />

        <Snow />
        <Sparkles count={isMobile ? 30 : 80} scale={[25, 25, 25]} size={4} speed={0.3} opacity={0.5} color="#FFD24A" />

        <group position={[0, 1.4, 0]}>
          <GestureZoom gestureRef={gestureRef}>
            <ChristmasTree appState={appState} gestureRef={gestureRef} />
            <Star appState={appState} />
          </GestureZoom>
        </group>

        <EffectComposer disableNormalPass multisampling={0}>
          <Bloom intensity={0.55} luminanceThreshold={0.7} luminanceSmoothing={0.05} mipmapBlur={false} />
          <Vignette offset={0.5} darkness={0.45} />
        </EffectComposer>

        {/* [FIX] Only render Environment if path is valid to prevent crashes */}
        {PATHS.HDR && (
          <Suspense fallback={null}>
            <Environment files={PATHS.HDR} background={false} />
          </Suspense>
        )}

        <fog attach="fog" args={['#040806', 30, 80]} />
      </>
      );
    };

    const AudioController = () => {
      const [playing, setPlaying] = useState(false);
      const audioRef = useRef(null);
      useEffect(() => {
        if (PATHS.MUSIC) {
          audioRef.current = new Audio(PATHS.MUSIC);
          audioRef.current.loop = true;
          audioRef.current.volume = 0.5;
          const init = () => {
            if (audioRef.current.paused) audioRef.current.play().then(() => setPlaying(true)).catch(() => { });
            window.removeEventListener('click', init);
          };
          window.addEventListener('click', init);
          return () => { if (audioRef.current) audioRef.current.pause(); window.removeEventListener('click', init); };
        }
      }, []);

      if (!PATHS.MUSIC) return null;

      return (
        <button onClick={(e) => { e.stopPropagation(); if (playing) audioRef.current.pause(); else audioRef.current.play(); setPlaying(!playing); }} className={`fixed top-4 right-4 z-50 p-3 rounded-full backdrop-blur-md border ${playing ? 'bg-pink-500/30 text-pink-100' : 'bg-black/30 text-gray-400'}`}>
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d={playing ? "M18 6L6 18M6 6l12 12" : "M9 18V5l12-2v13"} /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg>
        </button>
      );
    };

    // Mirror the camera feed and overlay the tracked hand skeleton.
    const drawHand = (canvas, video, landmarks) => {
      if (!canvas || !video) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.save();
      ctx.clearRect(0, 0, w, h);
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, w, h);
      ctx.restore();
      if (!landmarks) return;

      const px = (i) => (1 - landmarks[i].x) * w;
      const py = (i) => landmarks[i].y * h;

      ctx.strokeStyle = 'rgba(255, 201, 74, 0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (const [a, b] of HAND_CONNECTIONS) {
        ctx.moveTo(px(a), py(a));
        ctx.lineTo(px(b), py(b));
      }
      ctx.stroke();

      ctx.fillStyle = '#2FD469';
      for (let i = 0; i < landmarks.length; i++) {
        ctx.beginPath();
        ctx.arc(px(i), py(i), 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    };

    // [GESTURE] Drives the scene from webcam hand tracking.
    // - OPEN PALM  -> explode the tree
    // - FIST       -> reassemble the tree
    // - PINCH      -> zoom in/out (finger distance)
    // - Hand X     -> spin the tree
    const GestureController = ({ gestureRef, onExplode }) => {
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const rafRef = useRef(0);
      const landmarkerRef = useRef(null);
      const streamRef = useRef(null);
      const typeRef = useRef(GESTURE.NONE);
      const frameCbRef = useRef(0);
      const startedRef = useRef(false);
      const [status, setStatus] = useState('idle'); // idle | loading | running | error
      const [error, setError] = useState('');
      const [current, setCurrent] = useState(GESTURE.NONE);

      const stop = useCallback(() => {
        cancelAnimationFrame(rafRef.current);
        rafRef.current = 0;
        if (videoRef.current && typeof videoRef.current.cancelVideoFrameCallback === 'function' && frameCbRef.current) {
          videoRef.current.cancelVideoFrameCallback(frameCbRef.current);
          frameCbRef.current = 0;
        }
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        if (landmarkerRef.current) {
          try { landmarkerRef.current.close(); } catch (e) { }
          landmarkerRef.current = null;
        }
        const g = gestureRef.current;
        g.active = false;
        g.x = 0;
        g.pinchAmt = 0;
        g.type = GESTURE.NONE;
        typeRef.current = GESTURE.NONE;
        startedRef.current = false;
        setCurrent(GESTURE.NONE);
        setStatus('idle');
      }, [gestureRef]);

      const start = useCallback(async () => {
        if (status === 'loading' || status === 'running') return;
        setStatus('loading');
        setError('');
        startedRef.current = true;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: 640, height: 480 },
            audio: false
          });
          if (!startedRef.current) {
            stream.getTracks().forEach(t => t.stop());
            return;
          }
          streamRef.current = stream;
          const video = videoRef.current;
          video.srcObject = stream;
          await video.play();

          const landmarker = await loadHandLandmarker();
          landmarkerRef.current = landmarker;

          if (!startedRef.current) {
            landmarker.close();
            return;
          }
          setStatus('running');
          const detect = () => {
            const v = videoRef.current;
            if (!v || v.readyState < 2) return;

            const results = landmarker.detectForVideo(v, performance.now());
            const landmarks = results.landmarks && results.landmarks[0];
            drawHand(canvasRef.current, v, landmarks);

            const g = gestureRef.current;
            if (!landmarks) {
              g.active = false;
              g.x = 0;
              g.pinchAmt = 0;
              g.type = GESTURE.NONE;
              if (typeRef.current !== GESTURE.NONE) {
                typeRef.current = GESTURE.NONE;
                setCurrent(GESTURE.NONE);
              }
              return;
            }

            const result = classifyGesture(landmarks);
            g.active = true;
            g.x = result.x;
            g.pinchAmt = result.type === GESTURE.PINCH ? result.pinchAmt : 0;
            g.type = result.type;
            if (result.type !== typeRef.current) {
              typeRef.current = result.type;
              setCurrent(result.type);
              if (result.type === GESTURE.OPEN_PALM) onExplode(true);
              else if (result.type === GESTURE.FIST) onExplode(false);
            }
          };

          // [PERF] requestVideoFrameCallback fires once per decoded camera frame,
          // so detection keeps up with the webcam instead of the render loop.
          if (typeof video.requestVideoFrameCallback === 'function') {
            const onFrame = () => {
              frameCbRef.current = 0;
              detect();
              const v = videoRef.current;
              if (v) frameCbRef.current = v.requestVideoFrameCallback(onFrame);
            };
            frameCbRef.current = video.requestVideoFrameCallback(onFrame);
          } else {
            let lastVideoTime = -1;
            const loop = () => {
              rafRef.current = requestAnimationFrame(loop);
              const v = videoRef.current;
              if (!v || v.readyState < 2) return;
              if (v.currentTime === lastVideoTime) return;
              lastVideoTime = v.currentTime;
              detect();
            };
            rafRef.current = requestAnimationFrame(loop);
          }
        } catch (e) {
          console.error(e);
          setError(e && e.message ? e.message : 'Camera / model unavailable');
          setStatus('error');
          if (streamRef.current) {
            streamRef.current.getTracks().forEach(t => t.stop());
            streamRef.current = null;
          }
        }
      }, [status, gestureRef, onExplode]);

      useEffect(() => () => stop(), [stop]);

      const active = status === 'running';

      return (
        <div className="fixed bottom-6 right-6 z-50 flex flex-col items-end gap-3">
          <video ref={videoRef} playsInline muted autoPlay style={{ position: 'absolute', width: 1, height: 1, opacity: 0, pointerEvents: 'none' }} />

          <div className={`relative w-40 h-[120px] rounded-xl overflow-hidden border border-emerald-400/40 shadow-[0_0_20px_rgba(47,212,105,0.25)] ${active ? 'block' : 'hidden'}`}>
            <canvas ref={canvasRef} width={160} height={120} className="w-full h-full object-cover" />
            <div className="absolute top-1 left-1 px-1.5 py-0.5 rounded bg-black/60 text-[9px] tracking-widest text-emerald-300 border border-emerald-400/30">
              {GESTURE_LABEL[current]}
            </div>
          </div>

          <button
            onClick={(e) => { e.stopPropagation(); active ? stop() : start(); }}
            className={`p-3 rounded-full backdrop-blur-md border transition-colors ${active ? 'bg-emerald-500/30 text-emerald-100 border-emerald-400/50' : 'bg-black/30 text-gray-400 border-white/10 hover:text-white'}`}
            title="Toggle gesture control"
          >
            {status === 'loading' ? (
              <span className="loader" style={{ width: 20, height: 20, borderWidth: 3 }}></span>
            ) : (
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M18 11V6a2 2 0 0 0-4 0v5" /><path d="M14 10V4a2 2 0 0 0-4 0v6" /><path d="M10 10.5V6a2 2 0 0 0-4 0v8" /><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
              </svg>
            )}
          </button>

          {status === 'error' && (
            <div className="max-w-[220px] p-2 rounded bg-red-500/20 border border-red-500/50 text-red-200 text-[10px] backdrop-blur-md">
              {error}
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [appState, setAppState] = useState(AppState.TREE);
      // [GESTURE] Mutable channel into the render loop — avoids re-rendering the scene per frame.
      const gestureRef = useRef({ active: false, x: 0, pinchAmt: 0, type: GESTURE.NONE });

      const handleExplode = useCallback((exploded) => {
        setAppState(exploded ? AppState.EXPLODE : AppState.TREE);
      }, []);

      return (
        <ErrorBoundary>
          <div className="w-full h-screen bg-[#050103] text-white relative overflow-hidden">
            <AudioController />
            <GestureController gestureRef={gestureRef} onExplode={handleExplode} />
            <div className="absolute inset-0 z-0" onClick={() => setAppState(s => s === AppState.TREE ? AppState.EXPLODE : AppState.TREE)}>
              <Canvas dpr={[1, 2]} gl={{ antialias: true }} camera={{ position: [0, 0, getCamZ()], fov: 45 }}>
                <Suspense fallback={<SafeLoader />}>
                  <Scene appState={appState} gestureRef={gestureRef} />
                </Suspense>
              </Canvas>
            </div>

            {/* WARNING BANNER FOR FILE PROTOCOL */}
            {isFileProtocol && (
              <div className="absolute top-20 left-6 z-50 bg-yellow-500/20 border border-yellow-500/50 p-2 rounded text-yellow-200 text-xs max-w-xs backdrop-blur-md">
                ⚠️ <b>Running in File Mode</b><br />
                Using online assets fallback.<br />
                For offline/local assets, please use a Local Server (e.g. VS Code Live Server).
              </div>
            )}

            <div className="absolute top-0 left-0 p-6 z-10 pointer-events-none">
              <h1 className="text-3xl md:text-4xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-emerald-300 to-amber-400 drop-shadow-[0_0_10px_rgba(255,201,74,0.45)]">Dear <span className="text-white font-light">Yue &amp; Lin</span></h1>
              <p className="mt-1 text-amber-200/50 text-xs tracking-widest">Local HDR Edition</p>
            </div>
            <div className="absolute bottom-6 left-6 z-10 pointer-events-none text-xs text-gray-400">
              <p>TAP SCREEN • PINCH TO ASSEMBLE</p>
              <p className="mt-1 text-emerald-300/60">GESTURE: OPEN PALM → EXPLODE • FIST → REASSEMBLE • PINCH → ZOOM • MOVE HAND → SPIN</p>
            </div>
          </div>
        </ErrorBoundary>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<React.StrictMode><App /></React.StrictMode>);
  </script>
</body>

</html>
